name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build
        run: .\gradlew.bat build

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: qol-jar
          path: build/libs/*.jar